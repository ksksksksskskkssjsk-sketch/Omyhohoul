name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the mod
        run: |
          ls -la
          for z in *.zip; do [ -e "$z" ] && unzip -q -o "$z"; done
          find . -name build.gradle -not -path "./.git/*"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build mod
        run: |
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -1)")
          cd "$DIR"
          gradle build --no-daemon
          rm -f build/libs/*-sources.jar
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: sniper-mod
          path: out/*.jar
      - name: Publish jar to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sniper mod (latest build)
          files: out/*.jar
